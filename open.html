<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>在 App 中打开 · YOMII</title>

<link rel="icon" type="image/png"
      href="https://raw.githubusercontent.com/1976764/jm-comic-android/main/logo/l.png"
      media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png"
      href="https://raw.githubusercontent.com/1976764/jm-comic-android/main/logo/a.png"
      media="(prefers-color-scheme: dark)">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
:root{
  --bg:#f5f5f7;
  --card:#fff;
  --text:#1d1d1f;
  --text2:#6e6e73;
  --text3:#a1a1a6;
  --line:rgba(0,0,0,.07);
  --fill:rgba(0,0,0,.045);
  --fill2:rgba(0,0,0,.08);
  --accent:#1d1d1f;
  --accent-fg:#fff;
  --shadow:0 18px 55px rgba(0,0,0,.08);
}
[data-theme="dark"]{
  --bg:#000;
  --card:#1c1c1e;
  --text:#f5f5f7;
  --text2:#a1a1a6;
  --text3:#6e6e73;
  --line:rgba(255,255,255,.09);
  --fill:rgba(255,255,255,.06);
  --fill2:rgba(255,255,255,.12);
  --accent:#fff;
  --accent-fg:#000;
  --shadow:0 22px 70px rgba(0,0,0,.55);
}
body{
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",
    "Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  transition:background .35s ease,color .35s ease;
}

/* 顶部导航：与 index.html 保持同一套视觉语言 */
.nav{
  position:sticky;top:0;z-index:20;height:64px;
  background:color-mix(in srgb,var(--bg) 72%,transparent);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid var(--line);
}
.nav-inner{
  height:100%;display:flex;align-items:center;justify-content:space-between;
  padding:0 32px 0 48px;
}
.brand{
  display:flex;align-items:center;gap:11px;
  color:var(--text);text-decoration:none;
}
.brand img{width:32px;height:32px;border-radius:8px;object-fit:contain}
.brand span{font-size:18px;font-weight:750;letter-spacing:-.025em}
.theme{
  width:36px;height:36px;border:0;border-radius:50%;
  display:grid;place-items:center;background:var(--fill);color:var(--text2);
  cursor:pointer;transition:.2s ease;
}
.theme:hover{background:var(--fill2);color:var(--text)}
.theme:active{transform:scale(.9)}
.theme svg{width:18px;height:18px}

/* 主体 */
.page{
  width:100%;max-width:760px;margin:0 auto;padding:0 24px;
}
.main{
  min-height:calc(100vh - 64px);
  display:flex;align-items:center;justify-content:center;
  padding:58px 0 72px;
}
.card{
  width:100%;max-width:560px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:28px;
  box-shadow:var(--shadow);
  padding:46px 44px 38px;
  text-align:center;
  position:relative;
  overflow:hidden;
}
.card::before{
  content:"";
  position:absolute;
  width:260px;height:260px;
  top:-150px;left:50%;
  transform:translateX(-50%);
  border-radius:50%;
  background:radial-gradient(circle,rgba(127,127,127,.10),transparent 68%);
  pointer-events:none;
}
.logo{
  position:relative;
  width:82px;height:82px;margin:0 auto 24px;
  border-radius:21px;object-fit:contain;
  box-shadow:0 12px 35px rgba(0,0,0,.13);
}
[data-theme="dark"] .logo{box-shadow:0 12px 35px rgba(0,0,0,.65)}

.eyebrow{
  color:var(--text3);
  font-size:12px;font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
  margin-bottom:10px;
}
h1{
  font-size:30px;line-height:1.18;
  letter-spacing:-.035em;font-weight:800;
}
.sub{
  max-width:420px;margin:13px auto 0;
  color:var(--text2);font-size:15px;line-height:1.65;
}

.comic-box{
  margin:28px auto 0;
  padding:16px 18px;
  border:1px solid var(--line);
  background:var(--fill);
  border-radius:18px;
  text-align:left;
}
.comic-label{
  color:var(--text3);font-size:11px;font-weight:700;
  letter-spacing:.08em;margin-bottom:7px;
}
.comic-id{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.comic-id strong{
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:18px;font-weight:750;font-variant-numeric:tabular-nums;
}
.badge{
  flex:none;
  padding:5px 9px;border-radius:999px;
  background:var(--fill2);color:var(--text2);
  font-size:11px;font-weight:700;
}

.actions{display:grid;gap:10px;margin-top:22px}
.btn{
  min-height:52px;padding:0 20px;border-radius:15px;
  display:flex;align-items:center;justify-content:center;gap:9px;
  text-decoration:none;font:inherit;font-size:15px;font-weight:700;
  border:1px solid transparent;cursor:pointer;
  transition:transform .18s cubic-bezier(.34,1.3,.6,1),
             opacity .2s ease,background .2s ease,border-color .2s ease;
}
.btn:active{transform:scale(.975)}
.btn svg{width:18px;height:18px}
.primary{background:var(--accent);color:var(--accent-fg);box-shadow:0 5px 18px rgba(0,0,0,.10)}
.primary:hover{opacity:.88}
.secondary{background:var(--fill);border-color:var(--line);color:var(--text)}
.secondary:hover{background:var(--fill2)}

.note{
  margin-top:20px;padding-top:19px;
  border-top:1px solid var(--line);
  color:var(--text3);font-size:12px;line-height:1.7;
}
.note b{color:var(--text2);font-weight:650}

.footer{
  margin-top:25px;color:var(--text3);font-size:11.5px;
  display:flex;align-items:center;justify-content:center;gap:7px;
}
.footer-dot{width:4px;height:4px;border-radius:50%;background:var(--text3)}

@media(max-width:600px){
  .nav{height:56px}
  .nav-inner{padding:0 20px 0 24px}
  .brand img{width:28px;height:28px;border-radius:7px}
  .brand span{font-size:16px}
  .page{padding:0 16px}
  .main{min-height:calc(100vh - 56px);padding:28px 0 42px}
  .card{padding:34px 20px 28px;border-radius:23px}
  .logo{width:68px;height:68px;border-radius:17px;margin-bottom:20px}
  h1{font-size:25px}
  .sub{font-size:14px;margin-top:10px}
  .comic-box{margin-top:23px;padding:14px 15px}
  .comic-id strong{font-size:16px}
  .actions{margin-top:17px}
  .btn{min-height:49px;font-size:14.5px}
}

/* 缺少 ID 时的状态 */
.card.is-error .comic-box{display:none}
.card.is-error .actions{margin-top:24px}
.card.is-error .note{margin-top:18px}
</style>
</head>

<body>
<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="./" aria-label="YOMII 首页">
      <img id="navLogo" src="https://raw.githubusercontent.com/1976764/jm-comic-android/main/logo/l.png" alt="YOMII">
      <span>YOMII</span>
    </a>

    <button class="theme" id="themeBtn" aria-label="切换主题">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.7 6.7 0 0 0 21 12.8Z"/>
      </svg>
    </button>
  </div>
</header>

<main class="page main">
  <section class="card" id="card">
    <img class="logo" id="logo" src="https://raw.githubusercontent.com/1976764/jm-comic-android/main/logo/l.png" alt="YOMII">

    <div class="eyebrow">YOMII · Comic</div>
    <h1 id="title">在 App 中打开这本漫画</h1>
    <p class="sub" id="sub">使用 YOMII 打开，可直接进入漫画并继续阅读。</p>

    <div class="comic-box" id="comicBox">
      <div class="comic-label">SHARED COMIC</div>
      <div class="comic-id">
        <strong id="pill">漫画 ID：—</strong>
        <span class="badge">JM</span>
      </div>
    </div>

    <div class="actions">
      <a class="btn primary" id="open" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
          <path d="M13 5h6v6M19 5l-9 9"/>
          <path d="M19 13v4a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4"/>
        </svg>
        打开 App
      </a>
      <a class="btn secondary" href="./">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M12 3v11m0 0 4-4m-4 4-4-4"/>
          <path d="M5 18v1a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-1"/>
        </svg>
        下载 App
      </a>
    </div>

    <p class="note" id="hint">
      点了「打开 App」没有反应？<b>可能还没有安装 YOMII。</b><br>
      如果在微信中打开，请使用右上角「···」→「在浏览器中打开」。
    </p>

    <div class="footer">
      <span>打开分享链接</span>
      <i class="footer-dot"></i>
      <span>YOMII</span>
    </div>
  </section>
</main>

<script>
(function(){
  const root = document.documentElement;
  const themeBtn = document.getElementById('themeBtn');
  const navLogo = document.getElementById('navLogo');
  const logo = document.getElementById('logo');
  const card = document.getElementById('card');
  const id = (new URLSearchParams(location.search).get('c') || '').trim();

  function setTheme(theme){
    root.setAttribute('data-theme', theme);
    const dark = theme === 'dark';
    const logoSrc = dark
      ? 'https://raw.githubusercontent.com/1976764/jm-comic-android/main/logo/a.png'
      : 'https://raw.githubusercontent.com/1976764/jm-comic-android/main/logo/l.png';
    navLogo.src = logoSrc;
    logo.src = logoSrc;
    localStorage.setItem('yomii-theme', theme);
  }

  const saved = localStorage.getItem('yomii-theme');
  if(saved){
    setTheme(saved);
  }else{
    setTheme(matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  }

  themeBtn.addEventListener('click', function(){
    setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  const openBtn = document.getElementById('open');
  const pill = document.getElementById('pill');
  const sub = document.getElementById('sub');
  const hint = document.getElementById('hint');

  if(!id){
    card.classList.add('is-error');
    pill.parentElement.parentElement.style.display = 'none';
    sub.textContent = '这个分享链接缺少漫画编号，请回到 YOMII 重新分享一次。';
    openBtn.style.display = 'none';
    hint.innerHTML = '你可以返回首页下载 App，或在 App 中重新生成漫画分享链接。';
    document.getElementById('title').textContent = '无法打开这本漫画';
    return;
  }

  pill.textContent = '漫画 ID：' + id;
  openBtn.href = 'yomii://comic/' + encodeURIComponent(id);
})();
</script>
</body>
</html>
