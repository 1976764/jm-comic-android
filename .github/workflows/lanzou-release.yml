name: 蓝奏云 Release 上传

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  upload-lanzou:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: python -m pip install --upgrade pip "requests[socks]"

      - name: 提取版本号
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: 下载发布资产
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: gh release download "$TAG" --pattern "JM-arm64-release.apk" --dir .

      - name: 上传蓝奏云并保留 3 个版本
        env:
          LANZOU_USERNAME: ${{ secrets.LANZOU_USERNAME }}
          LANZOU_PASSWORD: ${{ secrets.LANZOU_PASSWORD }}
          NOTICE_PASSWORD: ${{ secrets.NOTICE_PASSWORD }}
          API_BASE: ${{ vars.API_BASE }}
          # 可选：手动指定一组已确认可用的国内代理 ip:port（逗号分隔），
          # 仅在 proxy5.net 自动抓取被 Cloudflare 拦掉时兜底使用
          LANZOU_PROXIES: ${{ secrets.LANZOU_PROXIES }}
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
          ASSET_NAME: JM-arm64-release.apk
          KEEP_VERSIONS: "3"
        run: python .github/scripts/release_lanzou.py

      - name: 上传日志（仅供参考）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lanzou-upload-log
          path: |
            *.apk
            *.log
          if-no-files-found: ignore
          retention-days: 7