
name: Upload APK to Cloudflare R2

on:
  # 发布 Release 时自动运行
  release:
    types: [published]

  # 支持手动运行
  workflow_dispatch:

jobs:
  upload-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # 获取 Release 中的 APK
      - name: Download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ./apk

          # Release 自动触发时，使用当前 Release
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"

          # 手动运行时，获取最新 Release
          else
            TAG=$(gh release list \
              --repo "${{ github.repository }}" \
              --limit 1 \
              --exclude-drafts \
              --exclude-pre-releases \
              --json tagName \
              --jq '.[0].tagName')
          fi

          echo "使用 Release: $TAG"

          # 下载 APK
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern "JM-arm64-release.apk" \
            --dir ./apk

          # 检查 APK 是否存在
          if [ ! -f "./apk/JM-arm64-release.apk" ]; then
            echo "错误：没有找到 JM-arm64-release.apk"
            exit 1
          fi

          echo "APK 下载成功："
          ls -lh ./apk/JM-arm64-release.apk

      # 安装 AWS CLI
      - name: Check AWS CLI
        run: |
          aws --version

      # 上传到 Cloudflare R2
      - name: Upload APK to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws s3 cp \
            "./apk/JM-arm64-release.apk" \
            "s3://${R2_BUCKET}/JM-arm64-release.apk" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type "application/vnd.android.package-archive"

          echo "APK 已成功上传到 Cloudflare R2"
